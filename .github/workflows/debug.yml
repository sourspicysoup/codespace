name: debug

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Show IP info
        run: |
          curl ifconfig.io
          echo "runner:runner" | sudo chpasswd
          sudo systemctl start ssh

      - name: Download and setup Xray
        run: |
          # 下载 Xray 二进制
          sudo mkdir -p /var/log/v2ray
          sudo chmod 755 /var/log/v2ray
          curl -L https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o /tmp/Xray.zip
          unzip /tmp/Xray.zip -d /tmp/xray-tmp
          sudo cp /tmp/xray-tmp/xray /usr/local/bin/xray
          sudo chmod +x /usr/local/bin/xray

          # 下载 Xray 配置文件
          sudo mkdir -p /etc/xray
          curl -L https://github.com/pornnewbee/socks5-for-serv00/raw/refs/heads/main/Configs/V2Ray/config.json -o config.json
          sudo mv config.json /etc/xray/

          # 下载并安装 systemd 服务文件
          curl -L https://github.com/pornnewbee/socks5-for-serv00/raw/refs/heads/main/Configs/V2Ray/xray.service -o xray.service
          sudo mv xray.service /etc/systemd/system/
          sudo /usr/local/bin/xray -test -c /etc/xray/config.json

      - name: Start Xray service
        run: |
          sudo systemctl daemon-reload
          sudo systemctl enable xray
          sudo systemctl start xray
          sudo systemctl status xray --no-pager

      - name: Install latest cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          cloudflared --version
          sudo cloudflared service install eyJhIjoiMGYzNjczOGUxNTVkOTYwZDRmNGQ1NWYyMDRiNWI0OGUiLCJ0IjoiZTIxNWI2MzItMmRhMi00MDUwLWI2Y2QtODJkNDA4ZmNiMDk3IiwicyI6Ill6STRNMlpoT1RJdE9UVm1OQzAwTldReExXSmlZbVl0TkRSbE4yTmhaVFl5WkdKaSJ9
          sudo rm -rf ~/tmp

      - name: debug
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          cd ~
          python3 -m venv /home/runner/mcp-venv
          /home/runner/mcp-venv/bin/python -m pip install "mcp==2.2.0" uvicorn starlette
          cd ~
          curl -L https://github.com/pornnewbee/socks5-for-serv00/raw/refs/heads/main/Configs/MCP/shell-mcp.service -o shell-mcp.service
          curl -L https://github.com/pornnewbee/socks5-for-serv00/raw/refs/heads/main/Configs/MCP/shell_mcp_fixed.py -o shell_mcp.py
          sudo mv shell-mcp.service /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl enable shell-mcp
          sudo systemctl start shell-mcp
          sudo systemctl status shell-mcp --no-pager
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg && echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(. /etc/os-release && echo "$VERSION_CODENAME") main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list && sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp && printf 'net.ipv4.ip_forward = 1\nnet.ipv6.conf.all.forwarding = 1\nnet.ipv6.conf.all.accept_ra = 2\n' | sudo tee /etc/sysctl.d/99-zzz-cloudflare-warp-connector.conf && sudo sysctl --system
          curl -L https://raw.githubusercontent.com/sourspicysoup/codespace/refs/heads/main/.github/workflows/service/cloudflare-warp-mesh.service -o cloudflare-warp-mesh.service
          sudo mv cloudflare-warp-mesh.service /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl start cloudflare-warp-mesh
          sudo systemctl enable cloudflare-warp-mesh
          sudo systemctl status cloudflare-warp-mesh --no-pager
          sleep 99999
